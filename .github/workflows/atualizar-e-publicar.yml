name: Atualizar dados da Câmara de SBO

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'atualiza_dados.py'
      - 'requirements.txt'
      - '.github/workflows/atualiza.yml'

permissions:
  contents: write

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar dados e fotos oficiais na Câmara
        run: python atualiza_dados.py

      - name: Salvar dados e fotos atualizados no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_camara.json
          if [ -d "fotos" ]; then git add fotos/; fi
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza dados e fotos oficiais da Câmara"
            git pull --rebase origin main
            git push origin main
          fi